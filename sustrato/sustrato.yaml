apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: synapse-pg
    app.kubernetes.io/part-of: synapse
  name: synapse-pg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse-pg
  serviceName: synapse-pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-pg
        app.kubernetes.io/part-of: synapse
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres_superuser.password
              name: synapse-provision
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -q
            - -U
            - postgres
            - -h
            - 127.0.0.1
          periodSeconds: 5
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      enableServiceLinks: false
      imagePullSecrets:
      - name: harbor-pull
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: synapse-rmq
    app.kubernetes.io/part-of: synapse
  name: synapse-rmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse-rmq
  serviceName: synapse-rmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-rmq
        app.kubernetes.io/part-of: synapse
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: RABBITMQ_DEFAULT_USER
          value: synapse_provision
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              key: rabbitmq_admin.password
              name: synapse-provision
        image: registro.invalid/shared-rabbitmq:3.13.7-dme@sha256:d7454659725d0f76969dfc90a14bf0e5b3ca416c232e0faf276eb56079478c9d
        name: rabbitmq
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/lib/rabbitmq
          name: data
        - mountPath: /etc/rabbitmq/enabled_plugins
          name: plugins
          subPath: enabled_plugins
      enableServiceLinks: false
      imagePullSecrets:
      - name: harbor-pull
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: synapse-rmq-plugins-bk62h7t4mf
        name: plugins
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
