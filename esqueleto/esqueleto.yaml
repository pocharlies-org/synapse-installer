        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        name: gateway
        ports:
        - containerPort: 18790
          name: http
        - containerPort: 9101
          name: metrics
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/synapse
          name: config
          readOnly: true
        - mountPath: /etc/synapse/credentials
          name: credentials
          readOnly: true
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      imagePullSecrets:
      - name: harbor-pull
      securityContext:
        fsGroup: 10008
        runAsGroup: 10008
        runAsNonRoot: true
        runAsUser: 10008
        seccompProfile:
          type: RuntimeDefault
