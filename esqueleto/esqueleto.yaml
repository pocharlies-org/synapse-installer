      app.kubernetes.io/name: synapse-gateway
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        synapse.e-dani.com/credentials-generation: eventos-keep-aurora-v1
      labels:
        app.kubernetes.io/name: synapse-gateway
        app.kubernetes.io/part-of: synapse
        synapse.e-dani.com/family: core
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - -m
        - synapse_gateway
        env:
        - name: CREDENTIALS_DIRECTORY
          value: /etc/synapse/credentials
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: SYNAPSE_SERVICE
          value: gateway
        - name: HOME
          value: /tmp
