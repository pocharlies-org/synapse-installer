apiVersion: v1
data:
  adapter-supervisor.yaml: "service: synapse-adapter-supervisor\ndatabase:\n  dsn:\
    \ postgresql://synapse_adapter@${synapse_pg_host:=synapse-pg}:5432/synapse\nrabbitmq:\n\
    \  url: amqp://synapse_adapter_supervisor@${synapse_rmq_host:=synapse-rmq}:5672/%2Fsynapse\n\
    supervisor:\n  base_url: ${synapse_supervisor_url}\nmetrics:\n  host: 0.0.0.0\n\
    \  port: 9148\nlogging:\n  level: INFO\n  format: json\n"
  dispatcher.yaml: "service: synapse-dispatcher\nmetrics:\n  host: 0.0.0.0\n  port:\
    \ 9102\ndatabase:\n  dsn: postgresql://synapse_dispatcher@${synapse_pg_host:=synapse-pg}:5432/synapse\n\
    \  min_size: 2\n  max_size: 8\nrabbitmq:\n  url: amqp://synapse_dispatcher@${synapse_rmq_host:=synapse-rmq}:5672/%2Fsynapse\n\
    \  publisher_confirms: true\ndispatch:\n  poll_interval_ms: 250\n  batch_size:\
    \ 100\n  retry_max_attempts: 5\n  retry_backoff_initial_ms: 60000\n  retry_backoff_max_ms:\
    \ 900000\n  requeue_backoff_s: 300\nlogging:\n  level: WARNING\n  format: json\n"
  engine.yaml: "service: synapse-engine\ndatabase:\n  dsn: postgresql://synapse_engine@${synapse_pg_host:=synapse-pg}:5432/synapse\n\
    \  min_size: 2\n  max_size: 8\nrabbitmq:\n  url: amqp://synapse_engine@${synapse_rmq_host:=synapse-rmq}:5672/%2Fsynapse\n\
    \  management_url: http://${synapse_rmq_host:=synapse-rmq}:15672\nworkflows:\n\
    \  root: /srv/synapse/workflows\nmetrics:\n  host: 0.0.0.0\n  port: 9103\nlogging:\n\
    \  level: WARNING\n  format: json\ntimeout_reaper_interval_ms: 10000\n"
  gateway.yaml: "service: synapse-gateway\nhttp:\n  host: 0.0.0.0\n  port: 18790\n\
    metrics:\n  host: 0.0.0.0\n  port: 9101\ndatabase:\n  dsn: postgresql://synapse_gateway@${synapse_pg_host:=synapse-pg}:5432/synapse\n\
    \  min_size: 4\n  max_size: 16\nrabbitmq:\n  url: amqp://synapse_gateway@${synapse_rmq_host:=synapse-rmq}:5672/%2Fsynapse\n\
    logging:\n  level: INFO\n  format: json\nwebhooks:\n  shopify:\n    hmac_credential:\
    \ shopify.hmac.secret\n    hmac_header: X-Shopify-Hmac-Sha256\n    hmac_encoding:\
    \ base64\n  gmail:\n    hmac_credential: gmail.webhook.token\n    hmac_header:\
    \ X-Synapse-Gmail-Token\n    hmac_encoding: base64\n  stripe:\n    hmac_credential:\
    \ stripe.hmac.secret\n    hmac_header: Stripe-Signature\n    hmac_encoding: hex\n\
    \  telegram:\n    hmac_credential: telegram.webhook.secret\n    hmac_header: X-Telegram-Bot-Api-Secret-Token\n\
    \    hmac_encoding: base64\n  github_actions:\n    hmac_credential: github-actions.webhook.token\n\
    \    hmac_header: X-Synapse-GitHub-Token\n    hmac_encoding: base64\neventos:\n\
    \  producers:\n    paseo:\n      hmac_credential: eventos.paseo.webhook.secret\n\
    \      routing_keys:\n      - eventos.paseo.stop\n      - eventos.paseo.trozo\n\
    \      - eventos.paseo.turno\n      - eventos.paseo.pregunta\n      - eventos.paseo.permiso\n\
    \      - eventos.paseo.estado\n    correo:\n      hmac_credential: eventos.correo.webhook.secret\n\
    \      routing_keys:\n      - eventos.hermes.wake\n    whatsapp-voice:\n     \
    \ hmac_credential: whatsapp.webhook.secret\n      routing_keys:\n      - eventos.whatsapp.voice.pending\n\
    \    keep:\n      hmac_credential: eventos.keep.webhook.secret\n      routing_keys:\n\
    \      - eventos.keep.incidente\n      - eventos.keep.resuelto\n    aurora:\n\
    \      hmac_credential: eventos.aurora.webhook.secret\n      routing_keys:\n \
    \     - eventos.aurora.rca\n    sdk-runner:\n      hmac_credential: eventos.sdk-runner.webhook.secret\n\
    \      routing_keys:\n      - eventos.sdk-runner.turno\n      - eventos.sdk-runner.trozo\n\
    \      - eventos.sdk-runner.pregunta\n      - eventos.sdk-runner.permiso\n   \
    \   - eventos.sdk-runner.estado\n    claude-cli:\n      hmac_credential: eventos.claude-cli.webhook.secret\n\
    \      routing_keys:\n      - eventos.claude-cli.turno\n      - eventos.claude-cli.trozo\n\
    \      - eventos.claude-cli.pregunta\n      - eventos.claude-cli.permiso\n   \
    \   - eventos.claude-cli.estado\n    canal-telegram:\n      hmac_credential: eventos.canal-telegram.webhook.secret\n\
    \      routing_keys:\n      - canal.casa.recibido\n"
