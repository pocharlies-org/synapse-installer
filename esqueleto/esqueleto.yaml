apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: synapse-migrate
    app.kubernetes.io/part-of: synapse
  name: synapse-schema-migrate
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-migrate
        app.kubernetes.io/part-of: synapse
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --apply
        - --migrations-dir
        - /app/migrations
        command:
        - /app/.venv/bin/python3
        - -m
        - synapse_shared.migrations
        env:
        - name: HOME
          value: /tmp
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: SYNAPSE_POSTGRES_HOST
          value: ${synapse_pg_host:=synapse-pg}
        - name: SYNAPSE_POSTGRES_PORT
          value: '5432'
        image: registro.invalid/synapse@sha256:28694afa4c8049267885330085e047286d3ee4a4d79b1cce153456d98fe55dfa
        imagePullPolicy: IfNotPresent
        name: migrate
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/synapse/credentials
          name: credentials
          readOnly: true
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      imagePullSecrets:
      - name: harbor-pull
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: credentials
        secret:
          secretName: synapse-secrets
      - emptyDir:
          sizeLimit: 16Mi
        name: tmp
