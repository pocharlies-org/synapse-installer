apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: synapse-gateway
    app.kubernetes.io/part-of: synapse
    synapse.e-dani.com/metrics: 'true'
  name: synapse-gateway
spec:
  ports:
  - name: http
    port: 18790
    targetPort: 18790
  - name: metrics
    port: 9101
    targetPort: 9101
  selector:
    app.kubernetes.io/name: synapse-gateway
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: synapse-adapter-supervisor
    app.kubernetes.io/part-of: synapse
    synapse.e-dani.com/family: supervisor
    synapse.e-dani.com/hardened: full
  name: synapse-adapter-supervisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse-adapter-supervisor
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-adapter-supervisor
        app.kubernetes.io/part-of: synapse
        synapse.e-dani.com/family: supervisor
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - -m
        - synapse_adapter_supervisor
        env:
        - name: CREDENTIALS_DIRECTORY
          value: /etc/synapse/credentials
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: SYNAPSE_SERVICE
          value: adapter-supervisor
        - name: HOME
          value: /tmp
        image: registro.invalid/synapse@sha256:f95c3ed528ac1edd0cdb61ccf90f06fbffee50d402288bf299b47a080b415dfd
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9148
          periodSeconds: 20
          timeoutSeconds: 3
        name: adapter-supervisor
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 9148
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          limits:
            memory: 384Mi
          requests:
            cpu: 20m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 36
          httpGet:
            path: /healthz
            port: 9148
          periodSeconds: 10
        volumeMounts:
        - mountPath: /etc/synapse
          name: config
          readOnly: true
        - mountPath: /etc/synapse/credentials
          name: credentials
          readOnly: true
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      imagePullSecrets:
      - name: harbor-pull
      securityContext:
        fsGroup: 10008
        runAsGroup: 10008
        runAsNonRoot: true
        runAsUser: 10008
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: synapse
      volumes:
      - configMap:
          name: synapse-config
        name: config
      - configMap:
          name: adapter-supervisor-config-checksum-m6456hbkgt
        name: config-checksum
      - name: credentials
        projected:
          sources:
          - secret:
              name: synapse-secrets
          - secret:
              name: synapse-adapter-supervisor
              optional: true
          - secret:
              name: synapse-adapter-supervisor-arreglar
              optional: true
      - emptyDir:
          sizeLimit: 128Mi
        name: tmp
---
